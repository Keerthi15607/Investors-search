<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Investor Fit Analyzer</title>

  <!-- CSS -->
  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <!-- MAIN CONTAINER -->
  <div class="container">
    <div class="card">

      <h1>AI Investor Fit Analyzer</h1>
      <p class="subtitle">
        Analyze your startup and find best-fit investors.
      </p>

      <!-- SECTOR -->
      <div class="input-group">
        <input
          type="text"
          id="sector"
          placeholder="Sector (e.g. AI, FinTech)"
        />
      </div>

      <!-- COUNTRY -->
      <div class="input-group">
        <input
          type="text"
          id="country"
          placeholder="Country (e.g. India, USA)"
        />
      </div>

      <!-- STAGE -->
      <div class="input-group">
        <select id="stage">
          <option value="MVP">MVP</option>
          <option value="Early Revenue">Early Revenue</option>
          <option value="Growth">Growth</option>
        </select>
      </div>

      <!-- BUTTON -->
      <button
        type="button"
        class="analyze-btn"
        onclick="analyzeInvestorFit()"
      >
        Analyze Investor Fit
      </button>

      <!-- RESULT -->
      <div id="result"></div>

    </div>
  </div>

  <!-- JAVASCRIPT -->
  <script src="script.js"></script>

</body>
</html>
